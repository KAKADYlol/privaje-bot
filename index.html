<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Спасибо за участие!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-color: #1a1025;
            --accent: #9d4edd;
            --accent-light: #c77dff;
            --text-main: #ffffff;
            --text-secondary: #b8a9c9;
            --gold: #ffd700;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(ellipse at center, #2d1b4e 0%, #1a1025 50%, #0a0510 100%);
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Анимированный фон с частицами */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent-light);
            border-radius: 50%;
            animation: fall linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Конфетти */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            animation: confetti-fall linear infinite;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(100vh) rotate(1080deg) scale(0.5); opacity: 0; }
        }

        /* Плавающие капсулы */
        .floating-capsule {
            position: absolute;
            width: 40px;
            height: 60px;
            border-radius: 20px;
            opacity: 0.2;
            animation: float-capsule 8s ease-in-out infinite;
        }

        @keyframes float-capsule {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-50px) rotate(180deg); }
        }

        /* Основной контент */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }

        /* Трофей */
        .trophy {
            font-size: 120px;
            margin-bottom: 30px;
            animation: trophy-bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
        }

        @keyframes trophy-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        /* Заголовок */
        h1 {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold) 0%, #ffed4e 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.8)); }
        }

        /* Подзаголовок */
        .subtitle {
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 500px;
        }

        .subtitle strong {
            color: var(--accent-light);
            font-weight: 700;
        }

        /* Статистика */
        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-item {
            background: rgba(157, 78, 221, 0.2);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 20px 30px;
            min-width: 140px;
            backdrop-filter: blur(10px);
            animation: stat-appear 1s ease-out;
        }

        @keyframes stat-appear {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stat-number {
            font-size: 36px;
            font-weight: 900;
            color: var(--gold);
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Кнопка подарка */
        .gift-button {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 50%, #ff6b6b 100%);
            color: white;
            padding: 25px 60px;
            border-radius: 60px;
            font-size: 22px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 10px 40px rgba(255, 107, 107, 0.6);
            transition: all 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .gift-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 40px rgba(255, 107, 107, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 15px 60px rgba(255, 107, 107, 0.8); }
        }

        .gift-button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 60px rgba(255, 107, 107, 0.8);
        }

        .gift-button:active {
            transform: scale(0.98);
        }

        /* Иконка подарка */
        .gift-icon {
            display: inline-block;
            margin-right: 10px;
            animation: gift-wiggle 1s ease-in-out infinite;
        }

        @keyframes gift-wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        /* Подпись */
        .footer {
            margin-top: 60px;
            color: var(--text-secondary);
            font-size: 16px;
            opacity: 0.7;
        }

        .footer .heart {
            color: #ff6b6b;
            animation: heartbeat 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Музыкальная кнопка */
        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(157, 78, 221, 0.3);
            border: 2px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            font-size: 24px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .music-toggle:hover {
            background: rgba(157, 78, 221, 0.5);
            transform: scale(1.1);
        }

        .music-toggle.playing {
            animation: music-pulse 1s ease-in-out infinite;
        }

        @keyframes music-pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(157, 78, 221, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(157, 78, 221, 0); }
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            h1 { font-size: 36px; }
            .subtitle { font-size: 18px; }
            .trophy { font-size: 80px; }
            .gift-button { padding: 20px 40px; font-size: 18px; }
            .stat-item { min-width: 120px; padding: 15px 20px; }
            .stat-number { font-size: 28px; }
        }
    </style>
</head>
<body>
    <!-- Фоновые частицы -->
    <div class="particles" id="particles"></div>

    <!-- Кнопка музыки -->
    <div class="music-toggle" id="musicToggle" onclick="toggleMusic()">
        🎵
    </div>

    <!-- Фоновая музыка -->
    <audio id="bgMusic" loop>
        <source src="sounds/celebration.mp3" type="audio/mpeg">
    </audio>

    <!-- Основной контент -->
    <div class="container">
        <div class="trophy">🏆</div>
        
        <h1>СПАСИБО!</h1>
        
        <div class="subtitle">
            Ивент <strong>Privaje Challenges</strong> завершён!<br>
            Ты был частью чего-то крутого 💜
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number">7</span>
                <span class="stat-label">дней челленджей</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">∞</span>
                <span class="stat-label">эмоций</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">1</span>
                <span class="stat-label">крутое комьюнити</span>
            </div>
        </div>

        <a href="https://Flocktory.com" class="gift-button" target="_blank">
            <span class="gift-icon">🎁</span>
            Забрать подарок
        </a>

        <div class="footer">
            Сделано с <span class="heart">❤️</span> командой Privaje
        </div>
    </div>

    <script>
        // Генерация фоновых частиц
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const colors = ['#9d4edd', '#c77dff', '#ff6b6b', '#4ecdc4', '#ffe66d', '#a8e6cf', '#ff8b94', '#ffd700'];
            
            // Создаём падающие частицы
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 5 + 3) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.width = (Math.random() * 6 + 2) + 'px';
                particle.style.height = particle.style.width;
                particlesContainer.appendChild(particle);
            }

            // Создаём конфетти
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animationDuration = (Math.random() * 4 + 3) + 's';
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.width = (Math.random() * 10 + 5) + 'px';
                confetti.style.height = (Math.random() * 10 + 5) + 'px';
                particlesContainer.appendChild(confetti);
            }

            // Создаём плавающие капсулы
            for (let i = 0; i < 8; i++) {
                const capsule = document.createElement('div');
                capsule.className = 'floating-capsule';
                capsule.style.left = Math.random() * 100 + '%';
                capsule.style.top = Math.random() * 100 + '%';
                capsule.style.background = colors[Math.floor(Math.random() * colors.length)];
                capsule.style.animationDuration = (Math.random() * 4 + 6) + 's';
                capsule.style.animationDelay = Math.random() * 3 + 's';
                particlesContainer.appendChild(capsule);
            }
        }

        // Управление музыкой
        let isPlaying = false;
        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicToggle.classList.remove('playing');
                musicToggle.innerText = '🎵';
            } else {
                bgMusic.play().catch(e => console.log('Автовоспроизведение заблокировано:', e));
                musicToggle.classList.add('playing');
                musicToggle.innerText = '🎶';
            }
            isPlaying = !isPlaying;
        }

        // Пытаемся автоматически включить музыку при первом клике
        document.addEventListener('click', function initAudio() {
            if (!isPlaying) {
                bgMusic.volume = 0.3;
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicToggle.classList.add('playing');
                    musicToggle.innerText = '';
                }).catch(e => console.log('Автовоспроизведение заблокировано:', e));
            }
            document.removeEventListener('click', initAudio);
        }, { once: true });

        // Инициализация
        createParticles();
    </script>
</body>
</html>
